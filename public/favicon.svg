<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161022"/>
      <stop offset="60%" stop-color="#0a070e"/>
      <stop offset="100%" stop-color="#050307"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="45%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="cyberSlash" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb02e" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Rounded Base with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Iconic Futuristic Monogram 'H' (Clean, High Contrast, Perfectly Scalable) -->
  <g>
    <!-- Left Vertical Pillar -->
    <rect x="136" y="108" width="76" height="296" rx="20" fill="url(#fireGrad)"/>

    <!-- Right Vertical Pillar -->
    <rect x="300" y="108" width="76" height="296" rx="20" fill="url(#fireGrad)"/>

    <!-- Dynamic AI Bridge / Crossbar with Tech Chamfers -->
    <rect x="196" y="226" width="120" height="60" rx="14" fill="url(#cyberSlash)"/>

    <!-- Signature Glowing Brand Accent Dot (Matching Huzaifa Malik.) -->
    <circle cx="414" cy="116" r="26" fill="#ffb02e"/>
    <circle cx="414" cy="116" r="14" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>