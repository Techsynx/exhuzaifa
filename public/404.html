<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Huzaifa Malik</title>
  <meta name="description" content="The requested page could not be found on the portfolio of Huzaifa Malik (exhuzaifa)." />
  <meta name="robots" content="noindex,follow" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#0d040a" />

  <style>
    :root {
      --bg: #0d040a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6e6eb;
      --text-muted: #9e9ea8;
      --accent-orange: #ff6a3d;
      --accent-amber: #ffb02e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ff3b30 0%, #ff6a3d 50%, #ffb02e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.8rem;
    }
    p {
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      color: #0d040a;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 106, 61, 0.25);
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Resource Not Found</h1>
  <p>The neural pathway you requested is currently inactive or has migrated. Return to the main portal to explore projects and engineering architecture.</p>
  <a href="/" class="btn">
    <span>Return to Portfolio</span>
    <span aria-hidden="true">→</span>
  </a>
</body>
</html>
